<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jsfe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-layout">
    <div id="editor-pane">
      <button id="btnrun">run</button>
      <textarea id="txtinput" rows="16" cols="40">

(= count 0)
(= speed 25)
(= active t)
(= title "MiniImGui Demo")
(= notes "Hello World")
(= anchorPos "bottom-right")

(= draw (fn ()
  (gui-clear)
  (gui-begin "All Widgets Showcase" 16 16 420 540)
  (gui-label (if active "Status: Active" "Status: Paused"))
  (= active (gui-checkbox "Enabled" active))
  (= speed (gui-slider "Speed" speed 0 100))
  (= title (gui-text "Title" title))
  (= notes (gui-textarea "Notes" notes 120))
  (if (gui-button "Increment" 197)
    (= count (+ count 1)))
  (gui-same-line 6)
  (if (gui-button "Reset" 197)
    (= count 0))
  (gui-label (if active
    (do (print "count:" count "speed:" speed) "Logging...")
    "Idle"))

  ;; Widget Anchor showcase
  (gui-anchor "top-right" 0 0)
  (gui-label "Anchored Top-Right")
  (gui-anchor "none")

  (gui-anchor "bottom-left" 0 0)
  (gui-label (if active "Anchored Bottom-Left" "Paused Bottom-Left"))
  (gui-anchor "none")

  (gui-anchor anchorPos 0 0)
  (if (gui-button "Anchored Action")
    (do
      (= count (+ count 1))
      (= anchorPos (if (= anchorPos "bottom-right") "bottom-left" "bottom-right"))
      (print "Anchored button clicked! count:" count "next anchor:" anchorPos)))
  (gui-anchor "none")
  (gui-end)))

      </textarea>
      <textarea id="txtoutput" rows="10" cols="40"></textarea>
    </div>

    <div id="gui-pane"></div>
  </div>

  <script src="fe.js"></script>
  <script src="imgui.js"></script>
  <script src="os.js"></script>
</body>
</html>
