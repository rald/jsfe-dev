<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jsfe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-layout">
    <div id="editor-pane">
      <button id="btnrun">run</button>
      <textarea id="txtinput" rows="16" cols="40">

(= count 0)
(= speed 25)
(= active t)
(= title "MiniImGui Demo")
(= notes "Line 1: Edit me\nLine 2: Press Enter for newline\nLine 3: Scroll horizontally -> ----------------------------------------")

(= draw (fn ()
  (gui-clear)
  (gui-begin "All Widgets Showcase" 16 16 360 360 560 540)

  ; 1. Label
  (gui-label (if active "Status: Active" "Status: Paused"))
  (gui-label (if count count 0))

  ; 2. Checkbox
  (= active (gui-checkbox "Enabled" active))

  ; 3. Slider
  (= speed (gui-slider "Speed" speed 0 100))

  ; 4. Textfield (single-line)
  (= title (gui-text "Title" title))

  ; 5. Textarea (multi-line)
  (= notes (gui-textarea "Notes" notes 90))

  ; 6. Buttons
  (if (gui-button "Increment Count")
    (= count (+ count 1)))

  (if (gui-button "Reset All")
    (do
      (= count 0)
      (= speed 25)
      (= active t)
      (= title "MiniImGui Demo")
      (= notes "Line 1: Reset")))

  (if (gui-button "Print State")
    (print "count:" count "speed:" speed "active:" active "title:" title "notes:" notes))

  (gui-end)))
  
      </textarea>
      <textarea id="txtoutput" rows="10" cols="40"></textarea>
    </div>

    <div id="gui-pane"></div>
  </div>

  <script src="fe.js"></script>
  <script src="imgui.js"></script>
  <script src="os.js"></script>
</body>
</html>
