<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jsfe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-layout">
    <div id="editor-pane">
      <button id="btnrun">run</button>
      <textarea id="txtinput" rows="16" cols="40">

(= showDemo nil)
(= prevShowDemo nil)
(= count 0)
(= speed 25)
(= active t)
(= title "ImGuiDemo")
(= notes "Hello from ImGuiDemo")

(= demoSvg "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='#eef2fa' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='2' width='5' height='5' rx='1'/><rect x='9' y='2' width='5' height='5' rx='1'/><rect x='2' y='9' width='5' height='5' rx='1'/><path d='M11.5 9v5M9 11.5h5'/></svg>")

(= draw (fn ()
  (gui-clear)

  ;; Launcher placed directly on the canvas at (16, 16)
  (= showDemo (gui-launcher "ImGuiDemo" demoSvg showDemo 140 16 16))

  ;; ImGuiDemo window associated with the launcher
  (if showDemo
    (do
      (if (not prevShowDemo)
        (gui-reopen "ImGuiDemo"))
      (gui-begin "ImGuiDemo" 16 54 420 460)
      (gui-label (if active "Status: Active" "Status: Paused"))
      (= active (gui-checkbox "Enabled" active))
      (= speed (gui-slider "Speed" speed 0 100))
      (= title (gui-text "Title" title))
      (= notes (gui-textarea "Notes" notes 120))
      (gui-anchor "bottom-left" 0 0)
      (if (gui-button "Increment" 197)
        (= count (+ count 1)))
      (gui-anchor "bottom-right" 0 0)
      (if (gui-button "Reset" 197)
        (= count 0))
      (gui-anchor "none")
      (gui-label (if active
        (do (print "count:" count "speed:" speed) "Logging...")
        "Idle"))
      (gui-end)
      (if (not (gui-visible? "ImGuiDemo"))
        (= showDemo nil))))

  (= prevShowDemo showDemo)))

      </textarea>
      <textarea id="txtoutput" rows="10" cols="40"></textarea>
    </div>

    <div id="gui-pane"></div>
  </div>

  <script src="fe.js"></script>
  <script src="imgui.js"></script>
  <script src="repl.js"></script>
</body>
</html>
