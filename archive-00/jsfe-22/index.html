<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jsfe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-layout">
    <div id="editor-pane">
      <button id="btnrun">run</button>
      <textarea id="txtinput" rows="16" cols="40">
(= count 0)
(= speed 25)
(= active t)
(= title "MiniImGui Demo — type or scroll horizontally to test overflow")
(= notes "Line 1: Click inside to edit or use arrow keys\nLine 2: Press Enter for a new line\nLine 3: Long line to test horizontal scrolling -> ------------------------------------------------\nLine 4: More lines to test vertical scrollbar\nLine 5: Scroll down with wheel or drag thumb\nLine 6: Line six\nLine 7: Line seven\nLine 8: Line eight")

(= draw (fn ()
  (gui-clear)
  (gui-begin "All Widgets Showcase" 16 16 420 420)
  (gui-label (if active "Status: Active" "Status: Paused"))
  (= active (gui-checkbox "Enabled" active))
  (= speed (gui-slider "Speed" speed 0 100))
  (= title (gui-text "Title" title))
  (= notes (gui-textarea "Notes" notes 120))
  (if (gui-button "Increment")
    (= count (+ count 1)))
  (if (gui-button "Reset")
    (= count 0))
  (gui-label (if active
    (do (print "count:" count "speed:" speed) "Logging...")
    "Idle"))
  (gui-end)))
      </textarea>
      <textarea id="txtoutput" rows="10" cols="40"></textarea>
    </div>

    <div id="gui-pane"></div>
  </div>

  <script src="fe.js"></script>
  <script src="imgui.js"></script>
  <script src="os.js"></script>
</body>
</html>
