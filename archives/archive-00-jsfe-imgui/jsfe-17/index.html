<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jsfe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

	<button id="btnrun">run</button><br /><br />
	<textarea id="txtinput" rows="20" cols="40">

(= count 0)
(= speed 25)
(= active t)

(= draw (fn ()
  (gui-clear)
  (gui-begin "fe imgui" 12 12 280)
  (gui-label (if active "Status: Active" "Status: Paused"))
  (= active (gui-checkbox "Enabled" active))
  (= speed (gui-slider "Speed" speed 0 100))
  (if (gui-button "Increment")
    (= count (+ count 1)))
  (if (gui-button "Reset")
    (= count 0))
  (gui-label (if active
    (do (print "count:" count "speed:" speed) "Logging...")
    "Idle"))))

	</textarea><br /><br />
	<textarea id="txtoutput" rows="20" cols="40"></textarea>

	<script src="fe.js"></script>
	<script src="imgui.js"></script>
	<script src="os.js"></script>
</body>
</html>
