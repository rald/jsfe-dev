<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jsfe — S-Expression Web OS (Sweetie-16)</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
  <header id="os-topbar">
    <div class="topbar-group">
      <span class="os-brand">jsfe OS</span>
      <span class="os-philosophy">(philosophy all-is-a-list sweetie-16)</span>
      <button id="btn-repl" class="os-btn accent-mint">REPL</button>
      <button id="btn-root-files" class="os-btn">root/ Storage</button>
      <button id="btn-procs" class="os-btn">Procs</button>
      <button id="btn-snapshot" class="os-btn">OS S-Exp</button>
    </div>
    <div class="topbar-group">
      <button id="btn-save-snap" class="os-btn">Save root/os-state.sexp</button>
      <button id="btn-reboot" class="os-btn accent-warn">Reboot</button>
    </div>
  </header>

  <main id="os-desktop">
    <canvas id="os-canvas" width="1280" height="720"></canvas>
    <div id="os-icons" aria-label="Desktop Launchers"></div>
    <div id="os-windows" aria-label="Application Windows"></div>
  </main>

  <footer id="os-statusbar">
    <div class="status-item">PALETTE: <span class="status-val">SWEETIE-16</span></div>
    <div class="status-item">MAIN STORAGE: <span class="status-val">ROOT/ FOLDER (NO VFS)</span></div>
    <div id="status-msg" class="status-item">BOOTING...</div>
  </footer>

  <script type="module">
    import { JsfeKernel, resolveSweetieColor } from "./kernel.js";
    import { SWEETIE_16, SWEETIE_SWATCHES } from "./sweetie.js";

    const desktopEl = document.getElementById("os-desktop");
    const iconsEl = document.getElementById("os-icons");
    const windowsEl = document.getElementById("os-windows");
    const canvasEl = document.getElementById("os-canvas");
    const statusMsgEl = document.getElementById("status-msg");
    const ctx2d = canvasEl.getContext("2d");

    function resizeCanvas() {
      const rect = desktopEl.getBoundingClientRect();
      canvasEl.width = Math.max(300, Math.floor(rect.width));
      canvasEl.height = Math.max(200, Math.floor(rect.height));
      redrawCanvas();
    }

    let kernel;
    let activeDrag = null;
    let winSeq = 1;
    let replLogEl = null;
    let procsContainerEl = null;
    let rootFilesContainerEl = null;
    let rootEditorEl = null;
    let rootNameInputEl = null;

    function setStatus(text, isError = false) {
      statusMsgEl.textContent = text;
      statusMsgEl.className = isError ? "status-item status-err" : "status-item status-val";
    }

    function appendReplLine(text, cssClass = "log-print") {
      if (!replLogEl) return;
      const div = document.createElement("div");
      div.className = cssClass;
      div.textContent = text;
      replLogEl.appendChild(div);
      replLogEl.scrollTop = replLogEl.scrollHeight;
    }

    function redrawCanvas() {
      if (!ctx2d) return;
      ctx2d.clearRect(0, 0, canvasEl.width, canvasEl.height);
      if (!kernel || !Array.isArray(kernel.canvasOps)) return;
      for (const op of kernel.canvasOps) {
        if (op[0] === "rect") {
          uiHooks.drawRect(op[1], op[2], op[3], op[4], op[5], op[6]);
        } else if (op[0] === "line") {
          uiHooks.drawLine(op[1], op[2], op[3], op[4], op[5], op[6]);
        } else if (op[0] === "text") {
          uiHooks.drawText(op[1], op[2], op[3], op[4]);
        }
      }
    }

    const uiHooks = {
      onKernelPrint(msg) {
        appendReplLine(msg, "log-print");
      },
      onKernelError(err) {
        const traceStr = err && Array.isArray(err.trace) && err.trace.length
          ? ` | trace: ${err.trace.join(" <- ")}`
          : "";
        const text = `[err] ${err && err.message ? err.message : String(err)}${traceStr}`;
        appendReplLine(text, "log-err");
        setStatus(err && err.message ? err.message : "Runtime error", true);
      },
      onAppsUpdated(apps) {
        iconsEl.innerHTML = "";
        for (const app of apps) {
          const btn = document.createElement("div");
          btn.className = "desktop-icon";
          btn.title = `Launch ${app.title} (${app.id})`;

          const glyph = document.createElement("div");
          glyph.className = "desktop-icon-glyph";
          glyph.textContent = app.icon;

          const label = document.createElement("div");
          label.className = "desktop-icon-label";
          label.textContent = app.title;

          btn.appendChild(glyph);
          btn.appendChild(label);
          btn.addEventListener("click", () => {
            kernel.evalCode(`(os-open-app (quote ${app.id}))`, `open:${app.id}`).catch(uiHooks.onKernelError);
          });
          iconsEl.appendChild(btn);
        }
      },
      onRootFilesUpdated(files) {
        if (!rootFilesContainerEl) return;
        rootFilesContainerEl.innerHTML = "";
        for (const f of files) {
          const fname = typeof f === "string" ? f : f.name;
          const row = document.createElement("div");
          row.className = "sexp-list-item";

          const left = document.createElement("span");
          left.textContent = `root/${fname}`;
          left.style.color = SWEETIE_16.frosting;

          const right = document.createElement("div");
          right.style.display = "flex";
          right.style.gap = "4px";

          const openBtn = document.createElement("button");
          openBtn.className = "os-btn";
          openBtn.textContent = "Open";
          openBtn.addEventListener("click", async () => {
            try {
              const content = await kernel.readRootFile(fname);
              if (rootNameInputEl) rootNameInputEl.value = fname;
              if (rootEditorEl) rootEditorEl.value = content;
              setStatus(`Loaded root/${fname}`);
            } catch (err) {
              uiHooks.onKernelError(err);
            }
          });

          const evalBtn = document.createElement("button");
          evalBtn.className = "os-btn accent-mint";
          evalBtn.textContent = "Load";
          evalBtn.addEventListener("click", () => {
            kernel.evalCode(`(load "root/${fname}")`, `load:root/${fname}`)
              .then((r) => appendReplLine(`=> ${kernel.ctx.toString(r, true)}`, "log-out"))
              .catch(uiHooks.onKernelError);
          });

          right.appendChild(openBtn);
          right.appendChild(evalBtn);
          row.appendChild(left);
          row.appendChild(right);
          rootFilesContainerEl.appendChild(row);
        }
      },
      onProcsUpdated(procs) {
        if (!procsContainerEl) return;
        procsContainerEl.innerHTML = "";
        for (const p of procs) {
          const row = document.createElement("div");
          row.className = "sexp-list-item";
          const sexpRow = document.createElement("code");
          sexpRow.style.color = SWEETIE_16.pistachio;
          sexpRow.style.fontSize = "11px";
          sexpRow.textContent = `(proc #${p.pid} ${p.name} ${JSON.stringify(p.expr)})`;
          row.appendChild(sexpRow);
          procsContainerEl.appendChild(row);
        }
      },
      createWindow({ title = "Window", width = 420, height = 300, appId = "win" }) {
        const id = `win-${winSeq++}`;
        const winEl = document.createElement("section");
        winEl.className = "os-window focused";
        winEl.id = id;
        winEl.style.width = `${width}px`;
        winEl.style.height = `${height}px`;

        const offset = ((winSeq - 1) * 24) % 140;
        const x = Math.min(Math.max(96 + offset, 12), Math.max(40, desktopEl.clientWidth - width - 20));
        const y = Math.min(Math.max(16 + offset, 12), Math.max(40, desktopEl.clientHeight - height - 20));
        winEl.style.left = `${x}px`;
        winEl.style.top = `${y}px`;
        winEl.style.zIndex = String(++kernel.zCounter);

        const titlebar = document.createElement("div");
        titlebar.className = "os-win-titlebar";

        const titleSpan = document.createElement("span");
        titleSpan.className = "os-win-title";
        titleSpan.textContent = title;

        const controls = document.createElement("div");
        controls.className = "os-win-controls";

        const minBtn = document.createElement("button");
        minBtn.className = "os-win-btn";
        minBtn.textContent = "_";
        minBtn.title = "Minimize";

        const closeBtn = document.createElement("button");
        closeBtn.className = "os-win-btn close-btn";
        closeBtn.textContent = "x";
        closeBtn.title = "Close";

        controls.appendChild(minBtn);
        controls.appendChild(closeBtn);
        titlebar.appendChild(titleSpan);
        titlebar.appendChild(controls);

        const body = document.createElement("div");
        body.className = "os-win-body";

        winEl.appendChild(titlebar);
        winEl.appendChild(body);
        windowsEl.appendChild(winEl);

        const focusWin = () => {
          document.querySelectorAll(".os-window").forEach((w) => w.classList.remove("focused"));
          winEl.classList.add("focused");
          winEl.style.zIndex = String(++kernel.zCounter);
          const rec = kernel.windows.get(id);
          if (rec) rec.z = kernel.zCounter;
        };

        winEl.addEventListener("mousedown", focusWin);

        minBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const isHidden = body.style.display === "none";
          body.style.display = isHidden ? "flex" : "none";
          winEl.style.height = isHidden ? `${height}px` : "30px";
        });

        closeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          kernel.windows.delete(id);
          winEl.remove();
        });

        titlebar.addEventListener("mousedown", (e) => {
          if (e.target.tagName === "BUTTON") return;
          focusWin();
          const rect = winEl.getBoundingClientRect();
          activeDrag = {
            id,
            winEl,
            offsetX: e.clientX - rect.left,
            offsetY: e.clientY - rect.top
          };
        });

        kernel.windows.set(id, { id, appId, title, x, y, w: width, h: height, z: kernel.zCounter, bodyEl: body, winEl });
        return id;
      },
      clearWindowBody(winId) {
        const rec = kernel.windows.get(winId);
        if (rec && rec.bodyEl) rec.bodyEl.innerHTML = "";
      },
      addWindowText(winId, text, color = SWEETIE_16.marshmallow) {
        const rec = kernel.windows.get(winId);
        if (!rec || !rec.bodyEl) return;
        const p = document.createElement("div");
        p.textContent = text;
        p.style.color = resolveSweetieColor(color, SWEETIE_16.marshmallow);
        rec.bodyEl.appendChild(p);
      },
      addWindowInput(winId, placeholder = "") {
        const rec = kernel.windows.get(winId);
        if (!rec || !rec.bodyEl) return null;
        const inp = document.createElement("input");
        inp.type = "text";
        inp.className = "sexp-input";
        inp.value = placeholder;
        rec.bodyEl.appendChild(inp);
        return inp;
      },
      addWindowTextarea(winId, placeholder = "") {
        const rec = kernel.windows.get(winId);
        if (!rec || !rec.bodyEl) return null;
        const ta = document.createElement("textarea");
        ta.className = "sexp-textarea";
        ta.value = placeholder;
        rec.bodyEl.appendChild(ta);
        return ta;
      },
      addWindowLog(winId) {
        const rec = kernel.windows.get(winId);
        if (!rec || !rec.bodyEl) return null;
        const box = document.createElement("div");
        box.className = "sexp-log";
        rec.bodyEl.appendChild(box);
        return box;
      },
      addWindowButton(winId, label, onClick) {
        const rec = kernel.windows.get(winId);
        if (!rec || !rec.bodyEl) return;
        const btn = document.createElement("button");
        btn.className = "os-btn accent-mint";
        btn.textContent = label;
        btn.addEventListener("click", onClick);
        rec.bodyEl.appendChild(btn);
      },
      addWindowSwatches(winId) {
        const rec = kernel.windows.get(winId);
        if (!rec || !rec.bodyEl) return;
        const grid = document.createElement("div");
        grid.className = "swatch-grid";
        for (const sw of SWEETIE_SWATCHES) {
          const card = document.createElement("div");
          card.className = "swatch-card";
          const chip = document.createElement("div");
          chip.className = "swatch-chip";
          chip.style.backgroundColor = sw.hex;
          const caption = document.createElement("div");
          caption.textContent = `${sw.name}`;
          caption.style.color = SWEETIE_16.marshmallow;
          const hexText = document.createElement("div");
          hexText.textContent = sw.hex;
          hexText.style.color = SWEETIE_16.sugarDust;
          card.appendChild(chip);
          card.appendChild(caption);
          card.appendChild(hexText);
          grid.appendChild(card);
        }
        rec.bodyEl.appendChild(grid);
      },
      clearCanvas() {
        ctx2d.clearRect(0, 0, canvasEl.width, canvasEl.height);
      },
      drawRect(x, y, w, h, fill, stroke) {
        ctx2d.fillStyle = resolveSweetieColor(fill, SWEETIE_16.blueberry);
        ctx2d.strokeStyle = resolveSweetieColor(stroke, SWEETIE_16.frosting);
        ctx2d.lineWidth = 2;
        ctx2d.fillRect(x, y, w, h);
        ctx2d.strokeRect(x, y, w, h);
      },
      drawLine(x1, y1, x2, y2, color, width = 2) {
        ctx2d.strokeStyle = resolveSweetieColor(color, SWEETIE_16.pistachio);
        ctx2d.lineWidth = width;
        ctx2d.beginPath();
        ctx2d.moveTo(x1, y1);
        ctx2d.lineTo(x2, y2);
        ctx2d.stroke();
      },
      drawText(x, y, text, color) {
        ctx2d.fillStyle = resolveSweetieColor(color, SWEETIE_16.marshmallow);
        ctx2d.font = "bold 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";
        ctx2d.fillText(text, x, y);
      }
    };

    function openReplWindow() {
      const winId = uiHooks.createWindow({ title: "fe S-Exp REPL", width: 470, height: 360, appId: "repl" });
      const logBox = uiHooks.addWindowLog(winId);
      replLogEl = logBox;

      const inputRow = document.createElement("div");
      inputRow.style.display = "flex";
      inputRow.style.gap = "6px";

      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "sexp-input";
      inp.placeholder = "Type an S-expression, e.g. (+ 1 2) or (os-root-list)";

      const runBtn = document.createElement("button");
      runBtn.className = "os-btn accent-mint";
      runBtn.textContent = "Eval";

      const submitExpr = async () => {
        const code = inp.value.trim();
        if (!code) return;
        appendReplLine(`fe> ${code}`, "log-in");
        inp.value = "";
        try {
          const res = await kernel.evalCode(code, "repl");
          appendReplLine(`=> ${kernel.ctx.toString(res, true)}`, "log-out");
          setStatus("Evaluated S-expression list");
        } catch (err) {
          uiHooks.onKernelError(err);
        }
      };

      runBtn.addEventListener("click", submitExpr);
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitExpr();
      });

      inputRow.appendChild(inp);
      inputRow.appendChild(runBtn);

      const rec = kernel.windows.get(winId);
      rec.bodyEl.appendChild(inputRow);
      appendReplLine("; jsfe v12 ready — philosophy: all is a list (main storage: root/)", "log-meta");
    }

    async function openRootFilesWindow() {
      const winId = uiHooks.createWindow({ title: "root/ Main Storage", width: 490, height: 420, appId: "root-files" });
      const rec = kernel.windows.get(winId);

      const listDiv = document.createElement("div");
      listDiv.style.display = "flex";
      listDiv.style.flexDirection = "column";
      listDiv.style.gap = "4px";
      rootFilesContainerEl = listDiv;
      rec.bodyEl.appendChild(listDiv);

      const nameInp = document.createElement("input");
      nameInp.type = "text";
      nameInp.className = "sexp-input";
      nameInp.value = "custom.fe";
      rootNameInputEl = nameInp;
      rec.bodyEl.appendChild(nameInp);

      const editor = document.createElement("textarea");
      editor.className = "sexp-textarea";
      editor.value = `(print "hello from root/custom.fe")
(quote (root-main-storage (ok t)))`;
      rootEditorEl = editor;
      rec.bodyEl.appendChild(editor);

      const btnBar = document.createElement("div");
      btnBar.className = "sexp-toolbar";

      const saveBtn = document.createElement("button");
      saveBtn.className = "os-btn accent-mint";
      saveBtn.textContent = "Save to root/";
      saveBtn.addEventListener("click", async () => {
        const fname = nameInp.value.trim();
        if (!fname) return;
        try {
          const savedPath = await kernel.writeRootFile(fname, editor.value);
          setStatus(`Saved ${savedPath}`);
        } catch (err) {
          uiHooks.onKernelError(err);
        }
      });

      const loadRunBtn = document.createElement("button");
      loadRunBtn.className = "os-btn";
      loadRunBtn.textContent = "Save & Load";
      loadRunBtn.addEventListener("click", async () => {
        const fname = nameInp.value.trim();
        if (!fname) return;
        try {
          const savedPath = await kernel.writeRootFile(fname, editor.value);
          const res = await kernel.evalCode(`(load "${savedPath}")`, `save-load:${savedPath}`);
          appendReplLine(`=> ${kernel.ctx.toString(res, true)}`, "log-out");
        } catch (err) {
          uiHooks.onKernelError(err);
        }
      });

      btnBar.appendChild(saveBtn);
      btnBar.appendChild(loadRunBtn);
      rec.bodyEl.appendChild(btnBar);

      await kernel.listRootFiles();
    }

    function openProcsWindow() {
      const winId = uiHooks.createWindow({ title: "S-Exp Process & Eval List", width: 450, height: 320, appId: "procs" });
      const rec = kernel.windows.get(winId);
      const container = document.createElement("div");
      container.style.display = "flex";
      container.style.flexDirection = "column";
      container.style.gap = "4px";
      procsContainerEl = container;
      rec.bodyEl.appendChild(container);
      uiHooks.onProcsUpdated(kernel.procs);
    }

    function openSnapshotWindow() {
      const winId = uiHooks.createWindow({ title: "Full OS S-Expression State", width: 500, height: 380, appId: "snapshot" });
      const ta = uiHooks.addWindowTextarea(winId, kernel.buildOsSnapshotSexp());
      if (ta) ta.readOnly = true;
    }

    document.getElementById("btn-repl").addEventListener("click", openReplWindow);
    document.getElementById("btn-root-files").addEventListener("click", openRootFilesWindow);
    document.getElementById("btn-procs").addEventListener("click", openProcsWindow);
    document.getElementById("btn-snapshot").addEventListener("click", openSnapshotWindow);

    document.getElementById("btn-save-snap").addEventListener("click", async () => {
      try {
        await kernel.saveSnapshotToRoot("os-state.sexp");
        setStatus("Saved snapshot to root/os-state.sexp");
      } catch (err) {
        uiHooks.onKernelError(err);
      }
    });

    document.getElementById("btn-reboot").addEventListener("click", async () => {
      windowsEl.innerHTML = "";
      kernel.windows.clear();
      kernel.canvasOps = [];
      uiHooks.clearCanvas();
      openReplWindow();
      await kernel.boot();
      setStatus("Rebooted from root/auto.fe");
    });

    window.addEventListener("mousemove", (e) => {
      if (!activeDrag) return;
      const deskRect = desktopEl.getBoundingClientRect();
      const nx = Math.max(0, Math.min(e.clientX - deskRect.left - activeDrag.offsetX, deskRect.width - 80));
      const ny = Math.max(0, Math.min(e.clientY - deskRect.top - activeDrag.offsetY, deskRect.height - 32));
      activeDrag.winEl.style.left = `${nx}px`;
      activeDrag.winEl.style.top = `${ny}px`;
      const rec = kernel && kernel.windows ? kernel.windows.get(activeDrag.id) : null;
      if (rec) {
        rec.x = nx;
        rec.y = ny;
      }
    });

    window.addEventListener("mouseup", () => {
      activeDrag = null;
    });

    window.addEventListener("resize", resizeCanvas);

    (async () => {
      resizeCanvas();
      kernel = new JsfeKernel(uiHooks);
      openReplWindow();
      try {
        await kernel.boot();
        setStatus("READY (v12) — MAIN STORAGE: ROOT/");
      } catch (err) {
        uiHooks.onKernelError(err);
      }
    })();
  </script>
</body>
</html>
